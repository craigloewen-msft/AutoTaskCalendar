services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      # Mount host neovim config for LazyVim users
      - ~/.config/nvim:/home/node/.config/nvim:cached
      - ~/.local/share/nvim:/home/node/.local/share/nvim:cached
      - ~/.local/state/nvim:/home/node/.local/state/nvim:cached

    command: sleep infinity

    network_mode: service:db

    user: node

  db:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
      - "8080:8080"
      - "9229:9229"
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
